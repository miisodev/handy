name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test & Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The default shell on windows-latest is PowerShell, so any bash syntax in a run step parses
    # only on ubuntu and macOS and fails on Windows with no output. Pin bash for the whole job
    # (Git Bash is preinstalled on the Windows runners) so a step behaves the same everywhere.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # lib/ and bin/handy.js are committed build artifacts, and bin/handy.js is what the MCP
      # server and every plugin host actually execute. Without this check, editing src/ and
      # forgetting to rebuild passes CI while shipping a bundle whose behaviour differs from
      # the source it claims to represent. The build is byte-for-byte deterministic (verified:
      # two consecutive `npm run build` runs produce identical checksums and a clean tree), and
      # .gitattributes pins `* text=auto eol=lf` plus `*.png binary`, so line endings introduced
      # by a Windows checkout are normalised away and any diff here is real drift rather than noise.
      - name: Verify committed build artifacts are up to date
        run: |
          # Artifacts are generated, never hand-edited, so a fresh build must reproduce them
          # exactly. When it does not, name the file that diverged: "artifacts are stale" is not
          # actionable from a CI log, and log access is not always available to whoever triages it.
          if ! git diff --quiet -- lib bin public; then
            echo "::error::Committed build artifacts are stale. Run 'npm run build' and commit lib/, bin/handy.js, and public/handy.png."
            echo "--- changed artifacts ---"
            git status --porcelain -- lib bin public
            git diff --numstat -- lib bin public
            echo "--- first differing hunk per changed text artifact ---"
            for f in $(git diff --name-only -- lib bin | head -5); do
              echo "### $f"
              git diff -- "$f" | head -40
            done
            echo "--- toolchain ---"
            node --version
            exit 1
          fi

      - run: npm test
      - run: npm run validate
