name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test & Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # lib/ and bin/handy.js are committed build artifacts, and bin/handy.js is what the MCP
      # server and every plugin host actually execute. Without this check, editing src/ and
      # forgetting to rebuild passes CI while shipping a bundle whose behaviour differs from
      # the source it claims to represent. The build is byte-for-byte deterministic (verified:
      # two consecutive `npm run build` runs produce identical checksums and a clean tree), so
      # any diff here is real drift rather than noise.
      - name: Verify committed build artifacts are up to date
        run: |
          # Artifacts are generated, never hand-edited, so a fresh build must reproduce them
          # exactly. When it does not, say precisely which file diverged and how -- a bare
          # "artifacts are stale" is not actionable from a CI log, and the cause can be
          # platform-specific (a differing zlib in the runner's Node changes PNG deflate bytes,
          # for instance, with no source change at all).
          if ! git diff --quiet -- lib bin public; then
            echo "::error::Committed build artifacts are stale. Run 'npm run build' and commit lib/, bin/handy.js, and public/handy.png."
            echo "--- git status (untracked/deleted artifacts) ---"
            git status --porcelain -- lib bin public
            echo "--- git diff --numstat (added/removed lines per file) ---"
            git diff --numstat -- lib bin public
            echo "--- git diff --stat ---"
            git diff --stat -- lib bin public
            echo "--- first differing hunk of each changed text artifact ---"
            for f in $(git diff --name-only -- lib bin | head -5); do
              echo "### $f"
              git diff -- "$f" | head -40
            done
            echo "--- png identity ---"
            node -e "const c=require('crypto'),f=require('fs');for(const p of ['public/handy.png']){try{console.log(p,c.createHash('sha256').update(f.readFileSync(p)).digest('hex'),f.statSync(p).size+'B')}catch(e){console.log(p,'missing')}}"
            git show HEAD:public/handy.png > ./__committed.png 2>/dev/null || true
            node -e "const c=require('crypto'),f=require('fs');try{console.log('committed',c.createHash('sha256').update(f.readFileSync('./__committed.png')).digest('hex'),f.statSync('./__committed.png').size+'B')}catch(e){console.log('committed','unreadable')}"
            rm -f ./__committed.png
            echo "--- toolchain versions ---"
            node --version && node -e "console.log('zlib', process.versions.zlib || 'n/a')"
            exit 1
          fi

      - run: npm test
      - run: npm run validate
